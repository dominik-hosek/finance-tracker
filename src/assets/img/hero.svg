<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Kasička, rostoucí rostlinka z mincí a graf úspor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f5ec"/><stop offset="1" stop-color="#fff4e0"/></linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb59a"/><stop offset="1" stop-color="#f28c6b"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f2b84b"/></linearGradient>
  </defs>
  <rect width="640" height="420" rx="36" fill="url(#bg)"/>
  <circle cx="540" cy="80" r="120" fill="#cdeee0" opacity=".6"/>
  <circle cx="90" cy="380" r="110" fill="#ffe6c4" opacity=".7"/>
  <!-- chart card -->
  <g transform="translate(360 70) rotate(4)">
    <rect width="220" height="150" rx="20" fill="#fff" stroke="#1f2a2e" stroke-opacity=".08"/>
    <rect x="22" y="22" width="80" height="10" rx="5" fill="#cfd8d6"/>
    <rect x="22" y="40" width="50" height="8" rx="4" fill="#e3e8e6"/>
    <rect x="30" y="98" width="20" height="32" rx="5" fill="#9fe0c7"/>
    <rect x="62" y="84" width="20" height="46" rx="5" fill="#9fe0c7"/>
    <rect x="94" y="90" width="20" height="40" rx="5" fill="#9fe0c7"/>
    <rect x="126" y="70" width="20" height="60" rx="5" fill="#2fa784"/>
    <rect x="158" y="56" width="20" height="74" rx="5" fill="#0f5b4f"/>
    <path d="M34 92 L72 76 L104 82 L136 60 L170 44" stroke="#f28c6b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="44" r="7" fill="#f28c6b" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- receipt -->
  <g transform="translate(70 70) rotate(-8)">
    <path d="M0 0h130v170l-13-9-13 9-13-9-13 9-13-9-13 9-13-9-13 9-13-9-13 9z" fill="#fff" stroke="#1f2a2e" stroke-opacity=".08"/>
    <rect x="18" y="20" width="70" height="9" rx="4.5" fill="#0f5b4f"/>
    <g fill="#d7dedc"><rect x="18" y="46" width="60" height="7" rx="3.5"/><rect x="18" y="64" width="74" height="7" rx="3.5"/><rect x="18" y="82" width="50" height="7" rx="3.5"/><rect x="18" y="100" width="66" height="7" rx="3.5"/></g>
    <g fill="#f2b84b"><rect x="96" y="46" width="18" height="7" rx="3.5"/><rect x="100" y="64" width="14" height="7" rx="3.5"/><rect x="92" y="82" width="22" height="7" rx="3.5"/><rect x="98" y="100" width="16" height="7" rx="3.5"/></g>
    <rect x="18" y="126" width="96" height="3" rx="1.5" fill="#1f2a2e" opacity=".15"/>
    <rect x="70" y="138" width="44" height="10" rx="5" fill="#f28c6b"/>
  </g>
  <!-- plant growing from coins -->
  <g transform="translate(470 255)">
    <path d="M30 70 C30 40 30 20 32 -10" stroke="#2fa784" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M31 20 C10 18 -2 4 -4 -14 C16 -12 28 0 31 20Z" fill="#2fa784"/>
    <path d="M32 0 C52 -4 66 -20 66 -38 C46 -34 34 -22 32 0Z" fill="#0f5b4f"/>
    <path d="M32 -10 C26 -24 28 -36 36 -46 C42 -34 40 -22 32 -10Z" fill="#9fe0c7"/>
    <g>
      <ellipse cx="30" cy="112" rx="44" ry="12" fill="#b9801b"/><rect x="-14" y="98" width="88" height="14" fill="url(#coin)"/><ellipse cx="30" cy="98" rx="44" ry="12" fill="#ffd27a"/>
      <ellipse cx="30" cy="88" rx="44" ry="12" fill="#b9801b"/><rect x="-14" y="74" width="88" height="14" fill="url(#coin)"/><ellipse cx="30" cy="74" rx="44" ry="12" fill="#ffd27a"/>
      <ellipse cx="30" cy="74" rx="30" ry="7" fill="none" stroke="#e0a43a" stroke-width="2"/>
    </g>
  </g>
  <!-- piggy bank -->
  <g transform="translate(180 210)">
    <ellipse cx="110" cy="182" rx="120" ry="14" fill="#1f2a2e" opacity=".08"/>
    <rect x="50" y="130" width="30" height="50" rx="12" fill="#e2775a"/>
    <rect x="140" y="130" width="30" height="50" rx="12" fill="#e2775a"/>
    <ellipse cx="110" cy="100" rx="110" ry="80" fill="url(#pig)"/>
    <path d="M60 40 L48 0 L92 26Z" fill="#e2775a"/>
    <ellipse cx="200" cy="104" rx="28" ry="24" fill="#ffb59a" stroke="#e2775a" stroke-width="4"/>
    <circle cx="192" cy="102" r="4.5" fill="#a2452c"/><circle cx="208" cy="102" r="4.5" fill="#a2452c"/>
    <circle cx="170" cy="70" r="7" fill="#1f2a2e"/><circle cx="172.5" cy="67.5" r="2.2" fill="#fff"/>
    <path d="M0 96 C-22 96 -24 70 -8 70 C6 70 4 90 -14 92" stroke="#e2775a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="80" y="22" width="56" height="10" rx="5" fill="#a2452c"/>
    <ellipse cx="80" cy="96" rx="40" ry="22" fill="#fff" opacity=".18"/>
  </g>
  <!-- falling coin -->
  <g transform="translate(276 120)">
    <ellipse cx="22" cy="22" rx="22" ry="22" fill="#f2b84b"/><ellipse cx="22" cy="22" rx="15" ry="15" fill="none" stroke="#b9801b" stroke-width="3"/>
    <text x="22" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#b9801b">Kč</text>
    <path d="M10 -14 v-14 M22 -10 v-22 M34 -14 v-14" stroke="#f2b84b" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>
  <g fill="#f2b84b"><circle cx="330" cy="60" r="5"/><circle cx="600" cy="230" r="4"/><circle cx="40" cy="250" r="5"/></g>
</svg>
